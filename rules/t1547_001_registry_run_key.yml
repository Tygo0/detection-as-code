title: Registry Run Key Persistence via reg.exe
id: 2b9c4e71-6a3d-4f82-9e15-7c0a1d3b5f02
status: experimental
description: |
    Detects creation of an autostart entry under a Registry Run key using reg.exe,
    a common persistence mechanism (ATT&CK T1547.001). Verified against Atomic Red
    Team "Reg Key Run" (GUID e55be3fd-3521-4610-9d1a-e210e42dcf05).
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Tygo0
date: 2026-10-11
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - 'ADD'
            - '\CurrentVersion\Run'
    condition: selection
falsepositives:
    - Software installers that register autostart entries via reg.exe.
level: medium
tags:
    - attack.persistence
    - attack.t1547.001
