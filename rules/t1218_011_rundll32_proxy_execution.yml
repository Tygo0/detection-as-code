title: Rundll32 Proxy Execution of Script
id: 4d2e6a93-8c5f-4b14-9037-ae1c3f5d7b24
status: experimental
description: |
    Detects rundll32.exe executing inline script (javascript:/vbscript:) to proxy
    execution of code (ATT&CK T1218.011). Verified against Atomic Red Team
    "Rundll32 execute JavaScript Remote Payload With GetObject"
    (GUID 57ba4ce9-ee7a-4f27-9928-3c70c489b59d).
references:
    - https://attack.mitre.org/techniques/T1218/011/
author: Tygo0
date: 2026-10-11
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'javascript'
            - 'vbscript'
    condition: selection
falsepositives:
    - Rare; rundll32 invoking inline script is almost always suspicious.
level: high
tags:
    - attack.defense-evasion
    - attack.t1218.011
