title: Local Account Creation via New-LocalUser
id: 3c1d5f82-7b4e-4a93-8f26-9d0b2e4c6a13
status: experimental
description: |
    Detects creation of a local user account via the PowerShell New-LocalUser
    cmdlet (ATT&CK T1136.001), used for persistence. Verified against Atomic Red
    Team "Create a new user in PowerShell" (GUID bc8be0ac-475c-4fbf-9b1d-9fffd77afbde).
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: Tygo0
date: 2026-10-11
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains: 'New-LocalUser'
    condition: selection
falsepositives:
    - Legitimate administrative account provisioning scripts.
level: medium
tags:
    - attack.persistence
    - attack.t1136.001
